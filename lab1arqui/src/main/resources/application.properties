spring.application.name=lab1arqui
# Render define PORT; en local se usa 8080
server.port=${PORT:8080}

# Si existen las variables de entorno se usa Aiven; si no, MySQL local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bancoudea?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true
spring.mvc.contentnegotiation.media-types.json=application/json
spring.mvc.contentnegotiation.favor-parameter= false
spring.mvc.contentnegotiation.favor-path-extension=false
